name: SauceDemo Automated Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Runs every day at 08:00 UTC (1:30 PM IST)
    - cron: '0 8 * * *'
  # Allows manual triggering from GitHub UI
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Run TestNG Suite via Maven
        run: mvn clean test -DsuiteXmlFile=testng.xml

      - name: 4. Upload Extent HTML Report Artifact
        if: always() # Always upload report, even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: extent-test-report
          path: reports/ExtentReport.html